<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu! PP Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #FF66AA;
            --pink-bright: #FF3388;
            --pink-glow: #FF66AA55;
            --pink-dim: #FF66AA22;
            --yellow: #FFD700;
            --cyan: #00FFFF;
            --dark: #0A0A12;
            --dark2: #0F0F1E;
            --dark3: #14142A;
            --dark4: #1A1A35;
            --card-bg: #0D0D22;
            --text: #F0E8FF;
            --muted: #8888AA;
            --border: #2A2A55;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── FONDO ANIMADO ── */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ── SCANLINES ── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
            pointer-events: none;
            z-index: 9998;
        }

        /* ── LANDING ── */
        #landing {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .logo-wrap {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo-osu {
            font-family: 'Black Han Sans', sans-serif;
            font-size: clamp(5rem, 15vw, 11rem);
            color: transparent;
            -webkit-text-stroke: 3px var(--pink);
            text-shadow: 0 0 40px var(--pink-glow), 0 0 80px var(--pink-dim), 4px 4px 0 #55003388;
            line-height: 1;
            letter-spacing: -4px;
            animation: logo-pulse 3s ease-in-out infinite;
            position: relative;
        }

            .logo-osu::before {
                content: 'osu!';
                position: absolute;
                inset: 0;
                color: var(--pink);
                clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%);
                opacity: 0.18;
            }

        @keyframes logo-pulse {
            0%, 100% {
                filter: drop-shadow(0 0 20px var(--pink-glow));
            }

            50% {
                filter: drop-shadow(0 0 50px #FF3388AA) drop-shadow(0 0 100px #FF336644);
            }
        }

        .logo-sub {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(0.9rem, 2vw, 1.3rem);
            letter-spacing: 0.5em;
            color: var(--muted);
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

            .logo-sub span {
                color: var(--pink);
            }

        /* ── INPUTS LANDING ── */
        .search-section {
            width: 100%;
            max-width: 780px;
        }

        .section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            color: var(--pink);
            text-transform: uppercase;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

            .section-title::before, .section-title::after {
                content: '';
                flex: 1;
                height: 1px;
                background: linear-gradient(90deg, transparent, var(--pink-glow));
            }

            .section-title::after {
                background: linear-gradient(90deg, var(--pink-glow), transparent);
            }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .input-wrap {
            position: relative;
        }

        .input-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
            padding-left: 2px;
        }

        .player-input {
            width: 100%;
            background: var(--dark3);
            border: 1px solid var(--border);
            border-top: 2px solid var(--pink);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.7rem 1rem;
            outline: none;
            transition: all 0.2s;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }

            .player-input::placeholder {
                color: #44446699;
                font-weight: 400;
            }

            .player-input:focus {
                border-color: var(--pink-bright);
                background: var(--dark4);
                box-shadow: 0 0 20px var(--pink-dim), inset 0 0 10px rgba(255,102,170,0.05);
            }

        .mode-select {
            width: 100%;
            background: var(--dark3);
            border: 1px solid var(--border);
            border-top: 2px solid var(--cyan);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.7rem 1rem;
            outline: none;
            cursor: pointer;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
        }

            .mode-select option {
                background: var(--dark3);
            }

        .btn-search {
            width: 100%;
            background: linear-gradient(135deg, var(--pink-bright) 0%, #CC0066 100%);
            border: none;
            color: white;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 0.1em;
            padding: 1rem 2rem;
            cursor: pointer;
            position: relative;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            transition: all 0.2s;
            margin-top: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

            .btn-search::before {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
                clip-path: inherit;
            }

            .btn-search:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 30px rgba(255,51,136,0.5);
            }

            .btn-search:active {
                transform: translateY(0);
            }

            .btn-search.loading {
                pointer-events: none;
                background: linear-gradient(135deg, #882255 0%, #441133 100%);
            }

        /* ── RESULTADOS ── */
        #results {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            padding: 2rem;
            display: none;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
        }

        .results-logo {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 2rem;
            color: transparent;
            -webkit-text-stroke: 2px var(--pink);
            text-shadow: 0 0 20px var(--pink-glow);
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }

            .btn-back:hover {
                border-color: var(--pink);
                color: var(--pink);
            }

        /* ── CARDS ── */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            animation: card-in 0.6s cubic-bezier(0.23, 1, 0.32, 1) both;
            transition: transform 0.3s, box-shadow 0.3s;
        }

            .player-card:hover {
                transform: translateY(-6px) scale(1.01);
                box-shadow: 0 20px 60px rgba(255,102,170,0.2), 0 0 0 1px var(--pink-glow);
            }

        /* Rank badge */
        .card-rank-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 2.5rem;
            color: var(--pink);
            opacity: 0.15;
            z-index: 0;
            line-height: 1;
        }

        /* Corner accent */
        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-top: 40px solid var(--pink);
            border-right: 40px solid transparent;
            z-index: 2;
        }

        /* Bottom accent line */
        .player-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--pink-bright), var(--pink-glow), transparent);
        }

        @keyframes card-in {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-avatar-section {
            position: relative;
            padding: 1.5rem 1.5rem 0;
            display: flex;
            align-items: flex-end;
            gap: 1.2rem;
        }

        .avatar-frame {
            position: relative;
            flex-shrink: 0;
        }

        .avatar-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            display: block;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            border: 2px solid var(--pink);
            box-shadow: 0 0 25px var(--pink-glow), inset 0 0 10px rgba(255,102,170,0.1);
            transition: all 0.3s;
        }

        .player-card:hover .avatar-img {
            box-shadow: 0 0 50px rgba(255,51,136,0.6), 0 0 80px rgba(255,102,170,0.2);
        }

        .avatar-glow {
            position: absolute;
            inset: -4px;
            background: radial-gradient(circle, var(--pink-dim) 0%, transparent 70%);
            pointer-events: none;
        }

        .card-identity {
            flex: 1;
            padding-bottom: 0.5rem;
        }

        .country-flag {
            font-size: 1.4rem;
            margin-bottom: 0.2rem;
            display: block;
        }

        .player-name {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.5rem;
            color: var(--text);
            line-height: 1;
            margin-bottom: 0.3rem;
            word-break: break-all;
        }

        .player-title {
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: var(--pink);
            text-transform: uppercase;
        }

        /* PP SECTION */
        .pp-section {
            padding: 1.2rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        .pp-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .pp-value {
            font-family: 'Black Han Sans', sans-serif;
            font-size: clamp(2.8rem, 8vw, 4rem);
            color: var(--yellow);
            line-height: 1;
            text-shadow: 0 0 30px rgba(255,215,0,0.5), 0 0 60px rgba(255,215,0,0.2);
            letter-spacing: -2px;
        }

        .pp-unit {
            font-size: 1.5rem;
            color: var(--pink);
            margin-left: 4px;
            vertical-align: super;
        }

        .pp-bar-wrap {
            margin-top: 0.8rem;
            position: relative;
        }

        .pp-bar-bg {
            height: 4px;
            background: var(--border);
            position: relative;
        }

        .pp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--pink-bright), var(--yellow));
            box-shadow: 0 0 10px var(--pink-glow);
            transition: width 1s cubic-bezier(0.23, 1, 0.32, 1);
            width: 0;
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border-top: 1px solid var(--border);
        }

        .stat-cell {
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            position: relative;
            transition: background 0.2s;
        }

            .stat-cell:nth-child(even) {
                border-right: none;
            }

            .stat-cell:nth-last-child(-n+2) {
                border-bottom: none;
            }

            .stat-cell:hover {
                background: rgba(255,102,170,0.04);
            }

        .stat-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.2em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .stat-value {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }

            .stat-value.accent {
                color: var(--cyan);
            }

            .stat-value.gold {
                color: var(--yellow);
            }

        /* RANK DISPLAY */
        .rank-section {
            padding: 1rem 1.5rem;
            background: rgba(255,102,170,0.04);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .rank-global {
            text-align: center;
        }

        .rank-num {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.5rem;
            color: var(--pink);
            line-height: 1;
        }

        .rank-type {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: var(--muted);
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        .rank-divider {
            width: 1px;
            height: 40px;
            background: var(--border);
        }

        /* LOADING CARD */
        .card-loading {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 3rem;
            text-align: center;
            animation: card-in 0.4s both;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--pink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            color: var(--muted);
            text-transform: uppercase;
        }

        /* ERROR CARD */
        .card-error {
            background: var(--card-bg);
            border: 1px solid rgba(255,80,80,0.3);
            padding: 2rem 1.5rem;
            text-align: center;
            animation: card-in 0.4s both;
        }

        .error-icon {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 3rem;
            color: #FF5050;
            opacity: 0.5;
            margin-bottom: 0.5rem;
        }

        .error-text {
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            color: #FF8080;
            text-transform: uppercase;
        }

        /* ── PODIO BANNER ── */
        .podium-banner {
            max-width: 1200px;
            margin: 0 auto 2rem;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, rgba(255,215,0,0.08) 0%, transparent 100%);
            border: 1px solid rgba(255,215,0,0.2);
            border-left: 4px solid var(--yellow);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .podium-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: var(--yellow);
            text-transform: uppercase;
        }

        .podium-winner {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.4rem;
            color: var(--yellow);
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        /* ── REFRESH ── */
        .refresh-bar {
            max-width: 1200px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.2rem;
            background: var(--dark3);
            border: 1px solid var(--border);
        }

        .refresh-info {
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: var(--muted);
            text-transform: uppercase;
        }

            .refresh-info span {
                color: var(--cyan);
            }

        .btn-refresh {
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            padding: 0.4rem 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
        }

            .btn-refresh:hover {
                background: rgba(0,255,255,0.1);
            }

        /* ── MODO CHIPS ── */
        .mode-display {
            max-width: 1200px;
            margin: 0 auto 1.5rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .mode-chip {
            font-family: 'Oswald', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            padding: 0.3rem 0.8rem;
            text-transform: uppercase;
            background: rgba(255,102,170,0.15);
            border: 1px solid var(--pink-glow);
            color: var(--pink);
            clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 700px) {
            .inputs-grid {
                grid-template-columns: 1fr;
            }

            .cards-container {
                grid-template-columns: 1fr;
            }
        }
        .lang-switch {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 0.5rem;
            z-index: 9999;

            body.results-active .lang-switch {
                top: 80px;
            }
        }

            .lang-switch button {
                background: var(--dark3);
                border: 1px solid var(--border);
                border-top: 2px solid var(--cyan);
                color: var(--text);
                font-family: 'Oswald', sans-serif;
                font-size: 0.7rem;
                letter-spacing: 0.2em;
                padding: 0.4rem 0.8rem;
                cursor: pointer;
                clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
                transition: all 0.2s;
            }

                .lang-switch button:hover {
                    border-color: var(--pink);
                    color: var(--pink);
                    box-shadow: 0 0 10px var(--pink-glow);
                }

                .lang-switch button.active {
                    background: rgba(255,102,170,0.15);
                    border-color: var(--pink);
                    color: var(--pink);
                }
        #global-error {
            max-width: 1200px;
            margin: 0 auto 1.5rem;
            padding: 1rem;
            border: 1px solid rgba(255,80,80,0.4);
            background: rgba(255,80,80,0.08);
            color: #FF8080;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
            box-shadow: 0 0 20px rgba(255,80,80,0.2);
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button onclick="changeLang('es')">ES</button>
        <button onclick="changeLang('en')">EN</button>
        <button onclick="changeLang('de')">DE</button>
    </div>

    <!-- FONDO ANIMADO -->
    <canvas id="bg-canvas"></canvas>

    <!-- ══ LANDING ══ -->
    <section id="landing">
        <div class="logo-wrap">
            <div class="logo-osu">osu!</div>
            <div class="logo-sub">PP <span>TRACKER</span> // RANKED SHOWCASE</div>
        </div>

        <div class="search-section">
            <div class="section-title">Jugadores</div>

            <div class="inputs-grid">
                <div class="input-wrap">
                    <div class="input-label">Player 01</div>
                    <input class="player-input" id="p1" type="text" placeholder="username...">
                </div>
                <div class="input-wrap">
                    <div class="input-label">Player 02</div>
                    <input class="player-input" id="p2" type="text" placeholder="username...">
                </div>
                <div class="input-wrap">
                    <div class="input-label">Player 03</div>
                    <input class="player-input" id="p3" type="text" placeholder="username...">
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 2fr;gap:1rem;margin-bottom:1rem;">
                <div>
                    <div class="input-label">Modo</div>
                    <select class="mode-select" id="gamemode">
                        <option value="osu">osu!</option>
                        <option value="taiko">Taiko</option>
                        <option value="fruits">Catch</option>
                        <option value="mania">Mania</option>
                    </select>
                </div>
                <div style="display:flex;align-items:flex-end;">

                    <button class="btn-search" id="btn-search" onclick="doSearch()">
                        ▶ BUSCAR JUGADORES
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- ══ RESULTADOS ══ -->
    <section id="results">
        <div class="results-header">
            <div class="results-logo">osu!</div>
            <button class="btn-back" id="btn-back" onclick="goBack()">← Volver</button>
        </div>

        <div class="mode-display" id="mode-display"></div>

        <div class="refresh-bar">
            <div class="refresh-info"><span id="last-update">—</span></div>
            <button class="btn-refresh" id="btn-refresh" onclick="refreshData()"></button>
        </div>

        <div id="podium-banner" class="podium-banner" style="display:none;">
            <div>
                <div class="podium-label">👑 Líder</div>

        function applyLang() {

        // ══ CONFIGURACIÓN ══
        const CLIENT_ID = '52920';

        // ══ FONDO ANIMADO ══
        (function bgInit() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, circles = [];

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            function makeCircle() {
                return {
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 150 + 50,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    alpha: Math.random() * 0.04 + 0.01,
                    color: Math.random() > 0.5 ? '#FF66AA' : '#6644CC'
                };
            }

            resize();
            for (let i = 0; i < 12; i++) circles.push(makeCircle());

            window.addEventListener('resize', resize);

            // Grid lines
            function drawGrid() {
                ctx.strokeStyle = 'rgba(255,102,170,0.04)';
                ctx.lineWidth = 1;
                const step = 60;
                for (let x = 0; x < W; x += step) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
                }
                for (let y = 0; y < H; y += step) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
                }
            }

            function tick() {
                ctx.clearRect(0, 0, W, H);

                // Dark gradient base
                const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) / 1.5);
                grad.addColorStop(0, 'rgba(20,10,40,1)');
                grad.addColorStop(1, 'rgba(5,5,15,1)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                drawGrid();

                circles.forEach(c => {
                    c.x += c.vx; c.y += c.vy;
                    if (c.x < -c.r) c.x = W + c.r;
                    if (c.x > W + c.r) c.x = -c.r;
                    if (c.y < -c.r) c.y = H + c.r;
                    if (c.y > H + c.r) c.y = -c.r;

                    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
                    g.addColorStop(0, c.color + Math.floor(c.alpha * 255).toString(16).padStart(2, '0'));
                    g.addColorStop(1, c.color + '00');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                requestAnimationFrame(tick);
            }
            tick();
        })();

        // ══ API OSU! ══

        async function fetchPlayer(username, mode) {
            const res = await fetch(`/api/osu/${mode}/${encodeURIComponent(username)}`);

            if (!res.ok) {
                const t = LANGS[currentLang];
                throw new Error(
                    t.errors.userNotFound.replace('{user}', username)
                );

                const msg = t?.errors?.userNotFound
                    ? t.errors.userNotFound.replace('{user}', username)
                    : `User "${username}" not found`;
            }

            return res.json();
        }

        // ══ FORMATEO ══
        function fmtNum(n) {
            if (!n && n !== 0) return '—';
            return Math.round(n).toLocaleString('es');
        }

        function fmtAcc(n) {
            if (!n) return '—';
            return n.toFixed(2) + '%';
        }

        function fmtTime(secs) {
            if (!secs) return '—';
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            if (h > 999) return `${(h / 1000).toFixed(1)}k h`;
            return `${h}h ${m}m`;
        }

        function getCountryFlag(code) {
            if (!code) return '';
            return code.toUpperCase().split('').map(c =>
                String.fromCodePoint(0x1F1E6 + c.charCodeAt(0) - 65)
            ).join('');
        }

        function getUserTitle(pp) {
            if (!pp) return 'UNRANKED';
            if (pp >= 10000) return 'THE BEST';
            if (pp >= 8000) return 'ELITE PLAYER';
            if (pp >= 6000) return 'EXPERT';
            if (pp >= 4000) return 'ADVANCED';
            if (pp >= 2000) return 'INTERMEDIATE';
            return 'BEGINNER';
        }

        function renderCard(user, rank, maxPP, idx) {
            const t = LANGS[currentLang];

            const pp = Math.round(user.statistics?.pp || 0);
            const barPct = maxPP > 0 ? (pp / maxPP * 100) : 0;
            const delay = idx * 0.15;

            const card = document.createElement('div');
            card.className = 'player-card';
            card.style.animationDelay = delay + 's';

            const avatarUrl = user.avatar_url || 'https://osu.ppy.sh/images/layout/avatar-guest.png';
            const flag = getCountryFlag(user.country_code);
            const title = getUserTitle(pp);

            card.innerHTML = `
        <div class="card-rank-badge">#${rank}</div>

        <div class="card-avatar-section">
          <div class="avatar-frame">
            <div class="avatar-glow"></div>
            <img class="avatar-img" src="${avatarUrl}" alt="${user.username}" onerror="this.src='https://osu.ppy.sh/images/layout/avatar-guest.png'">
          </div>
          <div class="card-identity">
            <span class="country-flag">${flag}</span>
            <div class="player-name">${user.username}</div>
            <div class="player-title">${title}</div>
          </div>
        </div>

        <div class="pp-section">
          <div class="pp-label">${t.stats.pp}</div>

          </div>
        </div>

        <div class="stats-grid">

            <div class="stat-label">${t.stats.acc}</div>
            <div class="stat-value accent">${fmtAcc(user.statistics?.hit_accuracy)}</div>
          </div>
          <div class="stat-cell">
            <div class="stat-label">${t.stats.playcount}</div>

          </div>
          <div class="stat-cell">
            <div class="stat-label">${t.stats.playtime}</div>
            <div class="stat-value">${fmtTime(user.statistics?.play_time)}</div>
          </div>
          <div class="stat-cell">
            <div class="stat-label">${t.stats.score}</div>
            <div class="stat-value gold">${fmtNum(user.statistics?.total_score)}</div>
          </div>
        </div>

        <div class="rank-section">
          <div class="rank-global">
            <div class="rank-num">#${fmtNum(user.statistics?.global_rank) || '—'}</div>
            <div class="rank-type">${t.stats.global}</div>
          </div>
          <div class="rank-divider"></div>
          <div class="rank-global">
            <div class="rank-num">#${fmtNum(user.statistics?.country_rank) || '—'}</div>

          </div>

            <div class="rank-type">${t.stats.level}</div>
          </div>
        </div>
    `;

            return card;
        }

        // ══ BÚSQUEDA ══
        async function doSearch() {
            const names = [
                document.getElementById('p1').value.trim(),
                document.getElementById('p2').value.trim(),
                document.getElementById('p3').value.trim()
            ].filter(Boolean);

            if (!names.length) return;

            currentPlayers = names;
            currentMode = document.getElementById('gamemode').value;

            // Switch view
            document.getElementById('landing').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            document.querySelector('.lang-switch').style.top = '85px';

            const t = LANGS[currentLang];

            document.getElementById('mode-display').innerHTML =
                `<div class="mode-chip">${t.modes[currentMode] || currentMode}</div>
        <div class="mode-chip">
            ${names.length} ${names.length === 1 ? t.players.one : t.players.many}
        </div>`;

            await loadCards();

            // Auto-refresh cada 60s
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(refreshData, 60000);
        }

        async function loadCards() {
            const container = document.getElementById('cards');
            container.innerHTML = '';
            document.getElementById('podium-banner').style.display = 'none';

            // Mostrar spinners
            currentPlayers.forEach(() => {
                const loadDiv = document.createElement('div');
                loadDiv.className = 'card-loading';
                loadDiv.innerHTML = `<div class="spinner"></div>
        <div class="loading-text">${LANGS[currentLang].loading}</div>`;
                container.appendChild(loadDiv);
            });

            // Fetch todos en paralelo
            const results = await Promise.allSettled(
                currentPlayers.map(name => fetchPlayer(name, currentMode))
            );

            // Timestamp
            const now = new Date();
            document.getElementById('last-update').textContent =
                now.toLocaleTimeString('es', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

            // Procesar resultados (CREAR users correctamente)
            const users = results.map((r, i) => {
                if (r.status === 'fulfilled') {
                    return { ok: true, data: r.value, name: currentPlayers[i] };
                }
                return { ok: false, error: r.reason.message, name: currentPlayers[i] };
            });

            // ── ERRORES ──
            const t = LANGS[currentLang];
            const errorBox = document.getElementById('global-error');

            if (errorBox) {
                errorBox.style.display = 'none';

                const failed = users.filter(u => !u.ok).length;
                const success = users.filter(u => u.ok).length;

                if (failed > 0) {
                    let msg = "";

                    if (failed === users.length) {
                        msg = t.errors.all;
                    } else if (failed === 1) {
                        msg = t.errors.one;
                    } else if (failed === 2) {
                        msg = t.errors.two;
                    }

                    if (success > 0) {
                        msg += " — " + t.errors.mixed;
                    }

                    errorBox.textContent = msg;
                    errorBox.style.display = 'block';
                }
            }

            // Ordenar por PP desc
            const sorted = [...users].filter(u => u.ok).sort((a, b) =>
                (b.data.statistics?.pp || 0) - (a.data.statistics?.pp || 0)
            );
            const maxPP = sorted.length ? (sorted[0].data.statistics?.pp || 1) : 1;

            // Podio
            if (sorted.length >= 2) {
                document.getElementById('podium-banner').style.display = 'flex';
                document.getElementById('podium-winner').textContent =
                    `${sorted[0].data.username} — ${fmtNum(Math.round(sorted[0].data.statistics?.pp || 0))}pp`;
            }

            // Render
            container.innerHTML = '';
            users.forEach((u, idx) => {
                if (u.ok) {
                    const rank = sorted.findIndex(s => s.data.id === u.data.id) + 1;
                    const card = renderCard(u.data, rank, maxPP, idx);
                    container.appendChild(card);
                } else {
                    const errDiv = document.createElement('div');
                    errDiv.className = 'card-error';
                    errDiv.style.animationDelay = (idx * 0.15) + 's';
                    errDiv.innerHTML = `
                        <div class="error-icon">!</div>
                        <div class="error-text">${u.error}</div>
                        <div style="margin-top:0.5rem;font-size:0.7rem;color:#88446688;font-family:'Oswald',sans-serif;letter-spacing:0.1em;">${u.name}</div>
                      `;
                    container.appendChild(errDiv);
                }
            });

            // Animar barras
            setTimeout(() => {
                document.querySelectorAll('.pp-bar-fill').forEach(el => {
                    el.style.width = el.dataset.pct + '%';
                });
            }, 200);
        }

        async function refreshData() {
            const btn = document.getElementById('btn-refresh');

            btn.textContent = LANGS[currentLang].refreshing;
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';

            try {
                await loadCards();
            } finally {
                btn.textContent = LANGS[currentLang].refresh;
                btn.style.opacity = '1';
                btn.style.pointerEvents = '';
            }
        }

        function goBack() {
            if (refreshTimer) clearInterval(refreshTimer);
            document.getElementById('results').style.display = 'none';
            document.getElementById('landing').style.display = 'flex';
            document.querySelector('.lang-switch').style.top = '20px';
        }

        // Enter key
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && document.getElementById('landing').style.display !== 'none') {
                doSearch();
            }
        });
        applyLang();

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu! PP Tracker</title>
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'cyberpunk';
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Selector de idioma — se reposiciona según la sección activa -->
    <div class="lang-switch" id="lang-switch">
        <button class="lang-btn" onclick="changeLang('es')" data-lang="es">
            <span class="lang-flag">🇲🇽</span>
            <span class="lang-name">Español</span>
        </button>
        <button class="lang-btn" onclick="changeLang('en')" data-lang="en">
            <span class="lang-flag">🇺🇸</span>
            <span class="lang-name">English</span>
        </button>
        <button class="lang-btn" onclick="changeLang('de')" data-lang="de">
            <span class="lang-flag">🇩🇪</span>
            <span class="lang-name">Deutsch</span>
        </button>
    </div>

    <div class="top-right-controls" id="top-right-controls">
        <!-- Selector de theme — preparado para nuevos themes futuros -->
        <div class="theme-switch" id="theme-switch">
            <label class="theme-label" id="theme-label" for="theme-select"></label>
            <select class="theme-select" id="theme-select"></select>
        </div>

        <!-- Login osu! — vive junto al selector de theme -->
        <div class="auth-widget" id="auth-widget" aria-live="polite"></div>
    </div>

    <!-- Fondo animado -->
    <canvas id="bg-canvas"></canvas>

    <!-- ══ LANDING ══ -->
    <section id="landing">
        <div class="logo-wrap">
            <div class="logo-osu">osu!</div>
            <div class="logo-sub">PP <span>TRACKER</span> // RANKED SHOWCASE</div>
        </div>

        <div class="search-section">
            <div class="section-title">Jugadores</div>

            <div class="inputs-grid">
                <div class="input-wrap">
                    <div class="input-label">Player 01</div>
                    <input class="player-input" id="p1" type="text" placeholder="username...">
                </div>
                <div class="input-wrap">
                    <div class="input-label">Player 02</div>
                    <input class="player-input" id="p2" type="text" placeholder="username...">
                </div>
                <div class="input-wrap">
                    <div class="input-label">Player 03</div>
                    <input class="player-input" id="p3" type="text" placeholder="username...">
                </div>
                <div class="input-wrap">
                    <div class="input-label">Player 04</div>
                    <input class="player-input" id="p4" type="text" placeholder="username...">
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 2fr;gap:1rem;margin-bottom:1rem;">
                <div>
                    <div class="input-label">Modo</div>
                    <select class="mode-select" id="gamemode">
                        <option value="osu">osu!</option>
                        <option value="taiko">Taiko</option>
                        <option value="fruits">Catch</option>
                        <option value="mania">Mania</option>
                    </select>
                </div>
                <div style="display:flex;align-items:flex-end;">
                    <button class="btn-search" id="btn-search" onclick="doSearch()">
                        ▶ BUSCAR JUGADORES
                    </button>
                </div>
            </div>
        </div>

        <nav class="room-nav" aria-label="App sections">
            <a class="room-nav-link" href="#/compare" data-room-link="compare">
                <span class="room-nav-icon">◇</span>
                <span id="room-nav-compare"></span>
            </a>
            <a class="room-nav-link" href="#/friends" data-room-link="friends">
                <span class="room-nav-icon">◎</span>
                <span id="room-nav-friends"></span>
            </a>
            <a class="room-nav-link" href="#/history" data-room-link="history">
                <span class="room-nav-icon">⌁</span>
                <span id="room-nav-history"></span>
            </a>
        </nav>

    </section>

    <!-- ══ RESULTADOS ══ -->
    <section id="results">
        <div class="results-header">
            <div class="results-logo">osu!</div>
            <button class="btn-back" id="btn-back" onclick="goBack()">← Volver</button>
        </div>

        <div class="mode-display" id="mode-display"></div>

        <div class="refresh-bar">
            <div class="refresh-info"><span id="last-update">—</span></div>
            <button class="btn-refresh" id="btn-refresh" onclick="refreshData()"></button>
        </div>

        <div id="podium-banner" class="podium-banner" style="display:none;">
            <div>
                <div class="podium-label">👑 Líder</div>
                <div class="podium-winner" id="podium-winner">—</div>
            </div>
        </div>

        <div id="compare-summary" class="compare-summary" style="display:none;"></div>

        <div class="comparison-stage">
            <div id="compare-breakdown" class="compare-breakdown" style="display:none;"></div>
            <div class="comparison-main">
                <div id="global-error" style="display:none;"></div>
                <div class="cards-container" id="cards"></div>
            </div>
        </div>
    </section>

    <!-- ══ APP ROOMS ══ -->
    <section id="room-view" class="room-view" style="display:none;">
        <div class="room-header">
            <div class="room-logo">osu!</div>
            <button class="btn-back room-back" id="room-back" onclick="roomBack()">← Volver</button>
        </div>
        <div class="room-panel">
            <h1 class="room-title" id="room-title">—</h1>
            <p class="room-copy" id="room-copy">—</p>
            <div class="room-actions" id="room-actions"></div>
        </div>
    </section>

    <footer class="site-footer" id="site-footer">
        <span id="footer-created-by"></span>
        <a class="footer-creator-link" href="https://guns.lol/xmanusaddy" target="_blank" rel="noopener noreferrer">manu is washed</a>
        <span class="footer-separator" aria-hidden="true">/</span>
        <a class="footer-legal-link" id="footer-terms-link" href="/terms">Terms</a>
        <span class="footer-separator" aria-hidden="true">/</span>
        <a class="footer-legal-link" id="footer-privacy-link" href="/privacy">Privacy</a>
    </footer>

    <!-- ══ FOCUS MODE MODAL ══ -->
    <div id="focus-overlay" class="focus-overlay" onclick="closeFocus(event)">
        <div class="focus-modal" id="focus-modal">
            <div class="focus-bg" id="focus-bg"></div>
            <div class="focus-bg-overlay"></div>
            <button class="focus-close" onclick="closeFocusBtn()">✕</button>
            <div class="focus-content">
                <div class="focus-header">
                    <div class="focus-avatar-wrap" id="focus-avatar-wrap">
                        <div class="focus-avatar-glow"></div>
                        <img class="focus-avatar" id="focus-avatar" src="" alt="">
                    </div>
                    <div class="focus-identity">
                        <div class="focus-country-flag" id="focus-flag"></div>
                        <div class="focus-player-name" id="focus-name">—</div>
                        <div class="focus-player-title" id="focus-title">—</div>
                        <div class="focus-activity" id="focus-activity"></div>
                        <button class="focus-profile-link" id="focus-profile-link" type="button"></button>
                        <div class="focus-pp-wrap">
                            <div class="focus-pp-label">PERFORMANCE POINTS</div>
                            <div class="focus-pp-value" id="focus-pp">—<span class="focus-pp-unit">pp</span></div>
                        </div>
                    </div>
                    <div class="focus-ranks" id="focus-ranks-wrap">
                        <div id="focus-ranks"></div>
                        <div class="focus-rank-metrics" id="focus-rank-metrics"></div>
                    </div>
                </div>
                <div class="focus-topplay" id="focus-topplay">
                    <div class="focus-topplay-header">
                        <div class="focus-topplay-title">
                            <span class="focus-topplay-crown">♛</span>
                            <span class="focus-topplay-label">TOP PLAY</span>
                        </div>
                        <div class="focus-score-client" id="focus-score-client"></div>
                    </div>
                    <div class="focus-topplay-body" id="focus-topplay-body">
                        <div class="focus-tp-loading"><div class="spinner"></div></div>
                    </div>
                </div>
                <div class="focus-stats-grid" id="focus-stats"></div>
            </div>
        </div>
    </div>

    <script src="theme-manager.js"></script>
    <script src="script.js"></script>
</body>
</html>
